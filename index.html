<html>

<head>
  <style>
    body {
      margin: 0;
    }

    model-viewer {
      width: 100%;
      height: 100%
    }

    button[slot=ar-button] {
      background-color: white;
      border-radius: 4px;
      border: none;
      position: absolute;
      top: 32px;
      font-size: 1.5em;
    }
  </style>

</head>

<body>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>

  <model-viewer src="./steamp_updated.glb" ar ar-scale="fixed" camera-controls touch-action="pan-y" alt="Steamp"
    shadow-intensity="2" skybox-image="./belfast_open_field_1k.hdr" skybox-height="1.7m" autoplay
    max-camera-orbit="auto 90deg auto" xr-environment>
    <button slot="ar-button">
      <div class="ar-button-content">Vizualizati in Realitate Augmentata</div>
    </button>
  </model-viewer>
</body>

</html>
